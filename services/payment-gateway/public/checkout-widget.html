<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>포지랩 마켓 — 결제</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f6f8; display: flex; justify-content: center; padding: 2.5rem 1rem;
  }
  .shop-card {
    width: min(26rem, 100%); background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  .shop-header { padding: 1.2rem 1.4rem; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 0.5rem; }
  .shop-header .logo { font-size: 1.4rem; }
  .shop-header .name { font-weight: 700; }
  .shop-body { padding: 1.4rem; }

  .product-row { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0; }
  .product-row .thumb { font-size: 2rem; margin-right: 0.8rem; }
  .product-name { flex: 1; font-size: 0.9rem; color: #333; }
  .product-price { font-weight: 700; }

  .amount-select { display: flex; gap: 0.5rem; margin: 1rem 0; }
  .amount-select button {
    flex: 1; padding: 0.5rem; border-radius: 8px; border: 1px solid #ddd; background: #fafafa; cursor: pointer;
  }
  .amount-select button.active { border-color: #2563eb; background: #eff6ff; color: #1d4ed8; font-weight: 700; }

  .total-row { display: flex; justify-content: space-between; padding: 0.8rem 0; border-top: 1px dashed #ddd; margin-top: 0.5rem; font-weight: 700; }

  .pay-btn {
    width: 100%; padding: 0.9rem; border: none; border-radius: 10px; background: #2563eb; color: #fff;
    font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 1rem;
  }
  .pay-btn:disabled { background: #93c5fd; cursor: default; }

  .status-screen { text-align: center; padding: 2rem 0; }
  .status-icon { font-size: 3rem; margin-bottom: 0.6rem; }
  .status-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.4rem; }
  .status-desc { color: #666; font-size: 0.85rem; line-height: 1.5; }
  .spinner {
    width: 2.2rem; height: 2.2rem; border: 3px solid #dbeafe; border-top-color: #2563eb; border-radius: 50%;
    margin: 0 auto 1rem; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .retry-btn {
    margin-top: 1rem; padding: 0.6rem 1.2rem; border-radius: 8px; border: 1px solid #ddd; background: #fff; cursor: pointer;
  }

  @media (prefers-color-scheme: dark) {
    body { background: #17181c; }
    .shop-card { background: #24262b; box-shadow: none; border: 1px solid #34363c; }
    .shop-header { border-color: #34363c; }
    .product-name { color: #ddd; }
    .status-desc { color: #aaa; }
    .amount-select button { background: #2c2e34; border-color: #3a3c42; color: #ddd; }
  }
</style>
</head>
<body>
  <div class="shop-card">
    <div class="shop-header"><span class="logo">🛍️</span><span class="name">포지랩 마켓</span></div>
    <div class="shop-body" id="shop-view">
      <div class="product-row">
        <span class="thumb">🎧</span>
        <span class="product-name">노이즈캔슬링 무선 이어폰</span>
        <span class="product-price" id="product-price">10,000원</span>
      </div>
      <div class="amount-select">
        <button class="active" data-amount="10000">10,000원</button>
        <button data-amount="30000">30,000원</button>
        <button data-amount="80000">80,000원</button>
      </div>
      <div class="total-row"><span>결제 금액</span><span id="total-price">10,000원</span></div>
      <button class="pay-btn" id="pay-btn">결제하기</button>
    </div>

    <div class="shop-body" id="status-view" style="display:none">
      <div class="status-screen" id="status-screen"></div>
    </div>
  </div>

  <script>
    let selectedAmount = 10000;
    let pollTimer = null;

    document.querySelectorAll(".amount-select button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".amount-select button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        selectedAmount = Number(btn.getAttribute("data-amount"));
        const formatted = selectedAmount.toLocaleString("ko-KR") + "원";
        document.getElementById("product-price").textContent = formatted;
        document.getElementById("total-price").textContent = formatted;
      });
    });

    function showStatus(icon, title, desc, showRetry) {
      document.getElementById("shop-view").style.display = "none";
      document.getElementById("status-view").style.display = "block";
      document.getElementById("status-screen").innerHTML =
        (icon === "spinner" ? '<div class="spinner"></div>' : '<div class="status-icon">' + icon + "</div>") +
        '<div class="status-title">' + title + "</div>" +
        '<div class="status-desc">' + desc + "</div>" +
        (showRetry ? '<button class="retry-btn" id="retry-btn">다시 시도</button>' : "");
      if (showRetry) {
        document.getElementById("retry-btn").addEventListener("click", () => {
          document.getElementById("shop-view").style.display = "block";
          document.getElementById("status-view").style.display = "none";
        });
      }
    }

    document.getElementById("pay-btn").addEventListener("click", async () => {
      showStatus("spinner", "결제 처리 중...", "잠시만 기다려주세요.");
      try {
        const res = await fetch("/payments", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ merchantId: "demo-shop", amount: selectedAmount }),
        });
        const body = await res.json();
        if (!res.ok) {
          showStatus("😥", "결제 요청 실패", body.error?.message || "잠시 후 다시 시도해주세요.", true);
          return;
        }
        pollPaymentStatus(body.data.id);
      } catch (err) {
        showStatus("😥", "네트워크 오류", "인터넷 연결을 확인해주세요.", true);
      }
    });

    function pollPaymentStatus(paymentId) {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        const res = await fetch("/payments/" + paymentId);
        const body = await res.json();
        const payment = body.data;
        renderPaymentStatus(payment);
        if (["CONFIRMED", "FAILED", "DEAD"].includes(payment.status)) {
          clearInterval(pollTimer);
        }
      }, 1200);
    }

    function renderPaymentStatus(payment) {
      if (payment.status === "PENDING") {
        showStatus("spinner", "결제 처리 중...", "잠시만 기다려주세요.");
      } else if (payment.status === "IN_DOUBT") {
        // 회로 자체가 열려서 즉시 실패한 게 아니라, PG 응답을 못 받아 확인 중인 상태 —
        // 소비자에게는 그냥 조금 더 기다려달라는 화면으로 보여준다(내부 상태머신을
        // 그대로 노출하지 않음).
        showStatus("spinner", "결제 확인 중...", "확인이 조금 지연되고 있어요. 잠시만 기다려주세요.");
      } else if (payment.status === "CONFIRMED") {
        showStatus("✅", "결제 완료", selectedAmount.toLocaleString("ko-KR") + "원 결제가 완료되었습니다.");
      } else if (payment.status === "DEAD") {
        showStatus("⏳", "결제 확인 지연", "결제 확인에 시간이 오래 걸리고 있습니다. 고객센터로 문의해주세요.", true);
      } else if (payment.status === "FAILED") {
        const circuitOpen = (payment.lastError || "").includes("회로 차단");
        if (circuitOpen) {
          showStatus("🕐", "일시적으로 결제가 지연되고 있습니다", "잠시 후 다시 시도해주세요.", true);
        } else {
          showStatus("❌", "결제 실패", payment.lastError || "결제가 거절되었습니다.", true);
        }
      }
    }
  </script>
</body>
</html>
