services:
  gateway:
    build:
      context: ../..
      dockerfile: services/msa-checkout/Dockerfile
      secrets:
        - npm_token
    command: ["node", "dist/gateway/main.js"]
    ports:
      - "${GATEWAY_PORT:-3300}:3300"
    environment:
      PORT: 3300
      ORCHESTRATOR_URL: orchestrator:50051
      INVENTORY_SERVICE_URL: inventory-service:50053
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-msa-checkout-lab-secret}
      LOG_LEVEL: info
      # 기본값(20/60초)은 panel.html 하나만 있던 시절 기준 — 이제 panel.html(saga 목록
      # 폴링) + 개발자 콘솔("재고/saga 상태" 탭, 2초 폴링) + receipt.html이 각자 폴링하는
      # 구조라, 한 사람이 정상적으로 화면 여러 개를 띄우기만 해도 IP 하나가 금방 20회를
      # 넘겨 429가 났다(실제 재현 확인). 인가/악의적 폭주 데모 취지는 유지하되, 정상적인
      # 동시 폴링을 감당할 수 있게 여유를 둔다.
      RATE_LIMIT_LIMIT: "120"
    depends_on:
      - orchestrator
      - inventory-service
    restart: unless-stopped

  orchestrator:
    build:
      context: ../..
      dockerfile: services/msa-checkout/Dockerfile
      secrets:
        - npm_token
    command: ["node", "dist/orchestrator/main.js"]
    # 호스트 포트를 노출하지 않는다 — gateway가 유일한 진입점이어야 "내부 IP/port 은닉"이
    # 실질적으로 성립한다. /health, /metrics 확인은 `docker exec` 또는 gateway 경유로 한다.
    environment:
      PORT: 3301
      GRPC_PORT: 50051
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: saga_db
      ORDER_SERVICE_URL: order-service:50052
      INVENTORY_SERVICE_URL: inventory-service:50053
      SAGA_POLL_INTERVAL_MS: 2000
      LOG_LEVEL: info
    depends_on:
      - postgres
      - order-service
      - inventory-service
    restart: unless-stopped

  order-service:
    build:
      context: ../..
      dockerfile: services/msa-checkout/Dockerfile
      secrets:
        - npm_token
    command: ["node", "dist/order-service/main.js"]
    # 호스트 포트를 노출하지 않는다 — orchestrator와 동일한 이유(gateway만 유일한 진입점).
    environment:
      PORT: 3302
      GRPC_PORT: 50052
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: order_db
      LOG_LEVEL: info
    depends_on:
      - postgres
    restart: unless-stopped

  # 다중 인스턴스 정합성 검증 대상. 호스트 포트를 노출하지 않는다 — `--scale inventory-service=2`로
  # 여러 인스턴스를 띄우면 같은 호스트 포트를 매핑할 수 없고, 어차피 orchestrator/gateway만
  # Docker 내부 DNS(dns:///inventory-service:50053)로 접근하면 된다.
  inventory-service:
    build:
      context: ../..
      dockerfile: services/msa-checkout/Dockerfile
      secrets:
        - npm_token
    command: ["node", "dist/inventory-service/main.js"]
    environment:
      PORT: 3303
      GRPC_PORT: 50053
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: inventory_db
      LOG_LEVEL: info
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    restart: unless-stopped

secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN
