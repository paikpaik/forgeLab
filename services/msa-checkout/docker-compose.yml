services:
  gateway:
    build:
      context: .
      secrets:
        - npm_token
    command: ["node", "dist/gateway/main.js"]
    ports:
      - "${GATEWAY_PORT:-3300}:3300"
    environment:
      PORT: 3300
      ORCHESTRATOR_URL: orchestrator:50051
      INVENTORY_SERVICE_URL: inventory-service:50053
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-msa-checkout-lab-secret}
      LOG_LEVEL: info
    depends_on:
      - orchestrator
      - inventory-service
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      secrets:
        - npm_token
    command: ["node", "dist/orchestrator/main.js"]
    ports:
      - "${ORCHESTRATOR_PORT:-3301}:3301"
    environment:
      PORT: 3301
      GRPC_PORT: 50051
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: saga_db
      ORDER_SERVICE_URL: order-service:50052
      INVENTORY_SERVICE_URL: inventory-service:50053
      SAGA_POLL_INTERVAL_MS: 2000
      LOG_LEVEL: info
    depends_on:
      - postgres
      - order-service
      - inventory-service
    restart: unless-stopped

  order-service:
    build:
      context: .
      secrets:
        - npm_token
    command: ["node", "dist/order-service/main.js"]
    ports:
      - "${ORDER_SERVICE_PORT:-3302}:3302"
    environment:
      PORT: 3302
      GRPC_PORT: 50052
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: order_db
      LOG_LEVEL: info
    depends_on:
      - postgres
    restart: unless-stopped

  # 다중 인스턴스 정합성 검증 대상. 호스트 포트를 노출하지 않는다 — `--scale inventory-service=2`로
  # 여러 인스턴스를 띄우면 같은 호스트 포트를 매핑할 수 없고, 어차피 orchestrator/gateway만
  # Docker 내부 DNS(dns:///inventory-service:50053)로 접근하면 된다.
  inventory-service:
    build:
      context: .
      secrets:
        - npm_token
    command: ["node", "dist/inventory-service/main.js"]
    environment:
      PORT: 3303
      GRPC_PORT: 50053
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: inventory_db
      LOG_LEVEL: info
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    restart: unless-stopped

secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN
