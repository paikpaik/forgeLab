<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>webhook-relay 워크스페이스</title>
<style>
  /* 의도적으로 /shared/panel-ui.css를 쓰지 않는다 — 엔드포인트 등록/앱 관리 같은 랩 관리자
     화면(panel.html)과는 완전히 다른, 실제 Slack 워크스페이스를 그대로 흉내낸 별도 UI다.
     "웹훅이 실제로 어떤 제품에서 쓰이는가"를 눈으로 보여주는 게 이 페이지의 유일한 목적이라,
     랩 공통 카드/버튼 스타일을 섞으면 오히려 그 느낌이 흐려진다. */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  body { display: flex; }

  .sidebar { width: 15rem; flex-shrink: 0; background: #3f0e40; color: #cfc3cf; display: flex; flex-direction: column; }
  .workspace-header {
    padding: 0.9rem 1rem; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12); color: #fff; font-weight: 900; font-size: 1.05rem;
  }
  .workspace-header .chevron { opacity: 0.6; font-size: 0.8rem; }

  .sidebar-section { padding: 0.9rem 0.6rem 0.3rem 1rem; font-size: 0.78rem; color: #bcabbc; display: flex; align-items: center; justify-content: space-between; }
  .channel-list { display: flex; flex-direction: column; padding: 0 0.5rem; gap: 0.05rem; }
  .channel-item {
    padding: 0.35rem 0.6rem; border-radius: 6px; font-size: 0.88rem; color: #bcabbc;
    display: flex; align-items: center; gap: 0.4rem; cursor: default;
  }
  .channel-item.active { background: #1164a3; color: #fff; font-weight: 700; }
  .channel-item.fake { opacity: 0.65; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff; }
  .channel-top {
    padding: 0.7rem 1.1rem; border-bottom: 1px solid #e2e5ea; display: flex; flex-direction: column; flex-shrink: 0;
  }
  .channel-top .name { font-weight: 900; font-size: 1.05rem; color: #1d1c1d; }
  .channel-top .desc { font-size: 0.78rem; color: #616061; margin-top: 0.1rem; }

  .messages { flex: 1; overflow-y: auto; padding: 0.6rem 0; }
  .messages .empty { color: #868686; font-size: 0.85rem; padding: 1rem 1.1rem; }

  .message { display: flex; gap: 0.65rem; padding: 0.45rem 1.1rem; }
  .message:hover { background: #f8f8f8; }
  .message .avatar {
    width: 2.3rem; height: 2.3rem; border-radius: 8px; background: linear-gradient(135deg, #36c5f0, #2eb67d);
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0;
  }
  .message .body { flex: 1; min-width: 0; }
  .message .meta { font-size: 0.88rem; }
  .message .meta .bot-name { font-weight: 900; color: #1d1c1d; }
  .message .meta .app-tag {
    font-size: 0.65rem; color: #616061; background: #e8e8e8; border-radius: 3px; padding: 0.05rem 0.3rem; margin-left: 0.3rem;
  }
  .message .meta .time { color: #868686; font-size: 0.75rem; margin-left: 0.4rem; }
  .message .text { font-size: 0.9rem; color: #1d1c1d; margin: 0.15rem 0 0.4rem; }
  .message .attachment {
    border-left: 4px solid #2eb67d; background: #f8f8f8; border-radius: 0 4px 4px 0;
    padding: 0.5rem 0.7rem; max-width: 32rem;
  }
  .message .attachment.failed { border-left-color: #e01e5a; }
  .message .attachment .attachment-title { font-size: 0.78rem; font-weight: 700; color: #616061; margin-bottom: 0.3rem; }
  .message pre {
    margin: 0; font-size: 0.78rem; font-family: ui-monospace, monospace; color: #1d1c1d;
    white-space: pre-wrap; word-break: break-all;
  }

  .composer { padding: 0.7rem 1.1rem 1rem; flex-shrink: 0; }
  .composer-box {
    border: 1px solid #d1d5db; border-radius: 8px; padding: 0.6rem 0.8rem; color: #868686;
    font-size: 0.85rem; cursor: not-allowed; background: #fafafa;
  }
</style>
</head>
<body>
  <nav class="sidebar">
    <div class="workspace-header"><span>Webhook Relay</span><span class="chevron">▾</span></div>
    <div class="sidebar-section"><span>채널</span><span>+</span></div>
    <div class="channel-list">
      <div class="channel-item active"># webhook-notifications</div>
      <div class="channel-item fake"># general</div>
      <div class="channel-item fake"># random</div>
    </div>
  </nav>

  <main class="main">
    <div class="channel-top">
      <span class="name"># webhook-notifications</span>
      <span class="desc">서명이 검증된 웹훅이 도착할 때마다 Webhook Bot이 여기에 메시지를 올립니다</span>
    </div>
    <div class="messages" id="messages"><div class="empty">아직 도착한 웹훅이 없습니다 — 다른 탭에서 이벤트를 보내보세요.</div></div>
    <div class="composer">
      <div class="composer-box">메시지를 보낼 수 없는 채널입니다 · 이 채널은 앱 전용입니다</div>
    </div>
  </main>

  <script>
    const list = document.getElementById("messages");

    function appendMessage(msg) {
      if (list.querySelector(".empty")) list.innerHTML = "";
      const time = new Date(msg.at).toLocaleTimeString("ko-KR", { hour12: false });
      const el = document.createElement("div");
      el.className = "message";
      el.innerHTML =
        '<div class="avatar">🪝</div>' +
        '<div class="body">' +
        '<div class="meta"><span class="bot-name">Webhook Bot</span><span class="app-tag">APP</span><span class="time">' + time + "</span></div>" +
        '<p class="text">' + (msg.verified ? "새 이벤트가 도착했습니다: " : "⚠️ 서명 검증에 실패한 이벤트가 도착했습니다: ") + "<strong>" + msg.eventType + "</strong></p>" +
        '<div class="attachment' + (msg.verified ? "" : " failed") + '">' +
        '<div class="attachment-title">' + (msg.verified ? "PAYLOAD" : "PAYLOAD (서명 미검증)") + "</div>" +
        "<pre>" + JSON.stringify(msg.payload, null, 2) + "</pre>" +
        "</div></div>";
      list.appendChild(el);
      list.scrollTop = list.scrollHeight;
    }

    const source = new EventSource("/channel/stream");
    source.onmessage = (event) => appendMessage(JSON.parse(event.data));
  </script>
</body>
</html>
